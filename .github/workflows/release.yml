name: Release

# A PR merged into main releases the "version" in tinyjs.json, unless that
# version is already tagged — so bump it in the PR to ship a release.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new: ${{ steps.version.outputs.is-new }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: tinyjs.json
          sparse-checkout-cone-mode: false

      - id: version
        run: |
          version=$(jq -r .version tinyjs.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::notice::v$version is already released. Bump \"version\" in tinyjs.json to publish a new release."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.is-new == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - name: Install tinyjs
        env:
          TINYJS_VERSION: v0.53.1
        run: |
          curl -fsSL https://tinyjs.app/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH" # the installer's fallback link folder

      # Self-signed rather than ad-hoc: macOS ties the Accessibility grant to
      # the signing certificate, so it survives updates. An ad-hoc signature
      # ties it to the binary's hash, revoking the grant on every update.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is missing: add it in Doppler and sync the prd config to GitHub (see README › Releasing)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"
          # The certificate's SHA-1 hash, which codesign accepts as the identity
          identity=$(security find-identity -p codesigning "$keychain" | awk '/ 1\) / { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no code-signing identity."
            exit 1
          fi
          echo "TINYJS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Shown on the release page and in the in-app update prompt
      - name: Write release notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/notes.md"

      # One runner builds both CPUs; each publish merges its zip into one
      # manifest.json. Apple's timestamp server, which codesign calls, drops
      # the odd request, hence one retry per command.
      - name: Build and package
        run: |
          retry() { "$@" || "$@"; }
          for arch in arm64 x86_64; do
            retry tinyjs build --arch "$arch" --dmg
            retry tinyjs publish --arch "$arch" --notes-file "$RUNNER_TEMP/notes.md"
          done
          # tinyjs points the zips at update.url's folder (releases/latest);
          # pin them to this release's tag instead
          sed -i '' "s#/releases/latest/download/#/releases/download/v$VERSION/#" dist/publish/manifest.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "v$VERSION" \
            --target "$MERGE_COMMIT" \
            --title "Teneo $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.dmg dist/publish/*.zip dist/publish/manifest.json

      # A dead link here is an updater failing silently on users' Macs
      - name: Verify update links
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/manifest.json" \
            | jq -e --arg version "$VERSION" '.version == $version' > /dev/null
          jq -r '.. | .url? // empty' dist/publish/manifest.json | sort -u | xargs -n 1 curl -fsSIL -o /dev/null
