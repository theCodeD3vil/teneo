name: Release Android

# A PR merged into main releases the "version" in apps/mobile/package.json,
# unless that version is already tagged (android-v<version>) — so bump it in
# the PR to ship an Android release. The Mac app releases the same way from
# its own version (release.yml); a PR can bump either or both. A version with
# a beta suffix, such as 0.1.0-beta.1, is published as a pre-release.
#
# When the PR bumps both, the APK is added to the Mac app's release as well,
# so one release holds everything the PR shipped. The Android release is
# still published: phones find their updates under its android-v tag.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  version:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new: ${{ steps.version.outputs.is-new }}
      mac-version: ${{ steps.version.outputs.mac-version }}
      mac-is-new: ${{ steps.version.outputs.mac-is-new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          sparse-checkout: |
            apps/mobile/package.json
            apps/desktop/tinyjs.json
          sparse-checkout-cone-mode: false

      - id: version
        run: |
          version=$(jq -r .version apps/mobile/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}(-beta\.[1-9][0-9]?)?$ ]] || [[ "$version" == *-beta.99 ]]; then
            echo "::error::\"version\" in apps/mobile/package.json is \"$version\". It must be like 1.2.3 or 1.2.3-beta.4, the last two numbers under 100 and the beta number under 99: Android's version code is made from them."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/android-v$version" > /dev/null; then
            echo "::notice::android-v$version is already released. Bump \"version\" in apps/mobile/package.json to publish a new Android release."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi
          # Whether this PR releases the Mac app too, by release.yml's own
          # rule. Asked now, in the run's first seconds: the Mac build takes
          # minutes to make its tag.
          mac_version=$(jq -r .version apps/desktop/tinyjs.json)
          echo "mac-version=$mac_version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$mac_version" > /dev/null; then
            echo "mac-is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "mac-is-new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.is-new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # The version apps/mobile/mise.toml pins: newer ones break the Android
      # build tools
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: bun install --frozen-lockfile

      # Android only installs an update signed with the key of the app it
      # replaces, so every release must be signed with this one key
      - name: Write signing key
        env:
          KEYSTORE_P12: ${{ secrets.ANDROID_KEYSTORE_P12 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_P12" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_P12 or ANDROID_KEYSTORE_PASSWORD is missing: add them in Doppler and sync the prd config to GitHub (see README › Releasing the Android app)."
            exit 1
          fi
          echo "$KEYSTORE_P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "TENEO_ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: apps/mobile
        env:
          TENEO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bun run build
          CI=true bunx cap sync android
          ./android/gradlew -p android :app:assembleRelease
          mv android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Teneo-$VERSION.apk"
          rm "$RUNNER_TEMP/release.p12"

      # An unsigned or wrongly versioned APK is one nobody can install or
      # update to. A beta is its own app, Teneo Beta: under the full release's
      # id it would replace Teneo on the phones that have both
      - name: Verify the APK
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose "$RUNNER_TEMP/Teneo-$VERSION.apk"
          package=com.michael.teneo
          if [[ "$VERSION" == *-beta.* ]]; then package=com.michael.teneo.beta; fi
          "$build_tools/aapt2" dump badging "$RUNNER_TEMP/Teneo-$VERSION.apk" \
            | grep -q "^package: name='$package' .*versionName='$VERSION'"

      - name: Write release notes
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/notes.md"

      # Never "latest": the Mac app updates from releases/latest, which must
      # stay a Mac release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "android-v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_COMMIT" \
            --title "Teneo for Android $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false \
            "${flags[@]}" \
            "$RUNNER_TEMP/Teneo-$VERSION.apk"

      # One release for everything the PR shipped: the Mac app's, with the
      # APK beside the disk images. The Mac release is this PR's when it was
      # made from this merge commit. It may not be there yet, as the Mac build
      # runs beside this one, so wait for it if the Mac version had no tag
      # when this run began. A run that waited its turn behind another finds
      # the tag already made, which is why the commit is asked too. If the
      # release never comes, the Mac build failed: the Android release above
      # is whole without it.
      - name: Add the APK to the Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_VERSION: ${{ needs.version.outputs.mac-version }}
          MAC_IS_NEW: ${{ needs.version.outputs.mac-is-new }}
          MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          for attempt in $(seq 1 90); do
            target=$(gh release view "v$MAC_VERSION" --repo "$GITHUB_REPOSITORY" \
              --json targetCommitish --jq .targetCommitish 2> /dev/null || true)
            if [ "$target" = "$MERGE_COMMIT" ]; then
              gh release upload "v$MAC_VERSION" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber \
                "$RUNNER_TEMP/Teneo-$VERSION.apk"
              exit 0
            fi
            # an earlier PR's release, or no Mac release due from this one
            if [ -n "$target" ] || [ "$MAC_IS_NEW" != "true" ]; then
              echo "This PR didn't release the Mac app: the APK is on the Teneo for Android $VERSION release only."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Teneo $MAC_VERSION wasn't released within 30 minutes, so the APK is only on the Teneo for Android $VERSION release."
