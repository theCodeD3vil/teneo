# Keeps the GitHub Actions the workflows pin by commit SHA up to date: each
# update arrives as a pull request that changes the SHA and its version
# comment, and goes through the same checks as any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
