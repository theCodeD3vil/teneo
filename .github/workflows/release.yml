name: Release

# A PR merged into main builds the "version" in apps/desktop/tinyjs.json,
# unless that version is already tagged — so bump it in the PR to ship a
# release. CI builds it as a DRAFT with an unsigned manifest.json. Installed
# apps accept only manifests signed with Teneo's update key, which never
# leaves the maintainer's Mac: `bun run release:publish` (in apps/desktop)
# checks the draft, signs the manifest and publishes it. See
# docs/release-process.md.
#
# A version with a suffix, such as 0.4.0-beta.1, is published as a
# pre-release: it is never "latest", so installed apps are not updated to it.
# A beta is an app of its own, Teneo Beta, that installs beside Teneo and
# updates from the "beta-channel" release, which holds the newest beta's
# manifest.json and nothing else.
# Runs on the push a merge into main makes: main's own copy of this workflow
# runs (a pull_request run would use the PR's copy, which anyone with a
# branch can write), and only main may use the "release" environment's
# signing secrets.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new: ${{ steps.version.outputs.is-new }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: apps/desktop/tinyjs.json
          sparse-checkout-cone-mode: false

      - id: version
        run: |
          version=$(jq -r .version apps/desktop/tinyjs.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::notice::v$version is already released. Bump \"version\" in apps/desktop/tinyjs.json to publish a new release."
            echo "is-new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is-new=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.is-new == 'true'
    runs-on: macos-15
    # The signing certificate is a secret of this environment, which only
    # main can use (docs/release-process.md › GitHub settings)
    environment: release
    permissions:
      contents: write
      pull-requests: read # the merged PR's title and body are the notes
      id-token: write # build provenance attestations
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # From v0.72 the app's updater compares whole versions. Before it, only
      # the three numbers were read, so a beta never saw a newer beta of the
      # same release: 0.4.0-beta.3 took 0.4.0-beta.4 for itself.
      # Pinned by hash: this job holds the signing certificate, so it runs
      # only the TinyJS checked here, not whatever tinyjs.app serves today.
      - name: Install tinyjs
        env:
          TINYJS_VERSION: v0.75.1
          TINYJS_SHA256: 4f70990877763ba3a621173e678a139cf6076eefca8b25b00e90079d0f90b37d # tinyjs-macos-arm64.tar.gz
        run: |
          archive="$RUNNER_TEMP/tinyjs.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/tarwin/tinyjsapp/releases/download/$TINYJS_VERSION/tinyjs-macos-arm64.tar.gz"
          echo "$TINYJS_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$HOME/.tinyjs" "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.tinyjs" --strip-components 1
          ln -sf "$HOME/.tinyjs/tinyjs" "$HOME/.local/bin/tinyjs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Self-signed rather than ad-hoc: macOS ties the Accessibility grant to
      # the signing certificate, so it survives updates. An ad-hoc signature
      # ties it to the binary's hash, revoking the grant on every update.
      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 is missing from the release environment: copy it from 1Password with `bun run release:secrets` (docs/release-process.md)."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/certificate.p12"
          # The certificate's SHA-1 hash, which codesign accepts as the identity
          identity=$(security find-identity -p codesigning "$keychain" | awk '/ 1\) / { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no code-signing identity."
            exit 1
          fi
          echo "TINYJS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # tinyjs.json is committed as the full release's. A beta version makes
      # it Teneo Beta's: its own name, id and update address
      - name: Name the app
        working-directory: apps/desktop
        run: bun scripts/set-release-identity.ts

      # Shown on the release page and in the in-app update prompt: the title
      # and body of the pull request this push merged. Installed apps up to
      # 0.4.3 show them as HTML, so they must be plain Markdown: HTML
      # comments are dropped, and raw HTML, images or non-https links fail
      # the run (scripts/release-notes.ts). release:publish shows them whole
      # before anything is signed.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
          if [ -z "$pr" ]; then
            echo "::error::$GITHUB_SHA isn't the merge of a pull request into main, so it has no release notes."
            exit 1
          fi
          printf '%s\n\n%s\n' "$(jq -r .title <<< "$pr")" "$(jq -r '.body // ""' <<< "$pr")" > "$RUNNER_TEMP/notes.md"
          bun apps/desktop/scripts/release-notes.ts "$RUNNER_TEMP/notes.md"

      # One runner builds both CPUs: apps, disk images, zips and one plain
      # manifest.json pinned to this release's tag. `tinyjs build`, not
      # `publish`: publish signs the manifest, and CI never has the key.
      # SENTRY_AUTH_TOKEN uploads the source maps that make Sentry's stack
      # traces readable; without it the build makes none
      - name: Build and package
        working-directory: apps/desktop
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun scripts/package-release.ts --notes-file "$RUNNER_TEMP/notes.md" --out "$RUNNER_TEMP/release"

      # A signed record, kept by GitHub, that these exact files came from this
      # workflow on this commit of main. release:publish checks it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

      # A draft: nobody sees it and no app updates to it until it is signed
      # and published from the maintainer's Mac
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          # drafts have no tag yet, and GitHub allows several with the same one
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::A v$VERSION release already exists. Publish or delete it before building another."
            exit 1
          fi
          # A beta must not become "latest": installed apps update from there
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" \
            --draft \
            --target "$MERGE_COMMIT" \
            --title "Teneo $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}" \
            "$RUNNER_TEMP"/release/*
          {
            echo "### Teneo $VERSION is a draft"
            echo "Sign and publish it on your Mac: \`cd apps/desktop && bun run release:publish $VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
