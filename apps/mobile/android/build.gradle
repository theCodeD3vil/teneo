// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Capacitor declares its own buildscript dependency. Use the same AGP version
// for every module so the locally cached Android tools can be reused.
subprojects {
    buildscript.configurations.classpath.resolutionStrategy.force 'com.android.tools.build:gradle:9.1.1'
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library')) {
            project.android.compileSdk {
                version = release(36) {
                    minorApiLevel = 1
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
