name: Release watchdog

# Pulls back any release Teneo didn't make. A Mac release must carry a
# manifest signed with Teneo's update key and point only at files CI
# uploaded; an Android release must hold only CI's files. Anything else is
# turned back into a draft at once, so nobody downloads or updates to it, and
# an issue (which emails the owner) says why. Rules: apps/desktop/scripts/
# release-manifest.ts. See docs/release-process.md.
#
# Release events from the account trigger this at once; the schedule catches
# files swapped into an existing release, which raise no event.
on:
  release:
    types: [published, released, prereleased, edited]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write # turn a release back into a draft
  issues: write

concurrency:
  group: release-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # the rules and the trusted key come from main, never from the release
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            apps/desktop/tinyjs.json
            apps/desktop/scripts/release-manifest.ts
            apps/desktop/scripts/release-watchdog.ts
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - run: bun apps/desktop/scripts/release-watchdog.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
